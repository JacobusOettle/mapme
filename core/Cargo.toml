[package]
name = "mapme-core"
version = "0.1.0"
edition = "2021"
description = "Georeferencing core for MapMe: grid labels and contour-vs-DEM matching"
license = "MIT"
publish = false

[lib]
name = "mapme_core"
crate-type = ["lib", "staticlib"]

[dependencies]
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rayon = "1.10"

[dev-dependencies]
jpeg-decoder = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = "debuginfo"

# Tests run the real 3507x4960 fixture; keep them fast even in `cargo test`.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
